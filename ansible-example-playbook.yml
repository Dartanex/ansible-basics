---
# In this example we are updating all the servers but when the web server comes out
# it will be instaled apache server using a contidional
# We also are going to declare the firewall, check if is running and allow http traffic
# We also use a loop to create multiple users
- name: Basic System Setup
# You can refer to all servers by placing the word "all" in the hosts parameter
# instead of an specific name like "web"
  hosts: all
  become: true
  tasks: 
    - name: update all security-related packages
      ansible.builtin.packages:
        name: '*'
        state: "{{ package_state }}"
        security: "{{ security_only }}"

    - name: Create a new User
      ansible.builtin.user:
        name: "{{ item }}"
        state: present
        create_home: true
      loop: 
        - daniel
        - josue
        - gerardo

    - name: Install Apache on web server
      ansible.builtin.package:
        name: "{{ package_name }}"
        state:  present
      when: inventory_hostname in groups['web']

    - name: Install firewalld
      ansible.builtin.package:
        name: firewalld
        state: present
      when: inventory_hostname in groups['web']

    - name: Ensure firewalld is running
      ansible.builtin.service:
        name: firewalld
        state: present
        enabled: true
      when: inventory_hostname in groups['web']

    - name: Allow HTTP traffic on web servers
      ansible.posix.firewalld:
        service: http
        permanent: true
        state: enabled
      when: inventory_hostname in group['web']
      notify: Reload Firewall

  handlers:

    - name: Reload firewall
      ansible.builtin.service:
        name: firewalld
        state: reloaded